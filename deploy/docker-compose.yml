# Example deployment of a Jellymesh node beside an existing Jellyfin server.
#
# Only the federation port is published. The admin API listens on loopback
# inside the container and is reached with the CLI through docker exec:
#
#   docker compose exec jellymesh /jellymesh status
#   docker compose exec jellymesh /jellymesh found family-and-friends
#   docker compose exec jellymesh /jellymesh invite
#
# The data volume holds the node's private key, its database, and the admin
# token. Back it up with `jellymesh backup`, not by copying it while running.
services:
  jellymesh:
    image: jellymesh:dev
    build: ..
    restart: unless-stopped
    ports:
      - "8443:8443"
      # Direct paths between members (assumption A-16): UDP for QUIC and
      # STUN. Publishing it keeps Docker's own NAT from moving the port.
      - "41641:41641/udp"
      # The relay, for Jellyfin only. Publish it on loopback, never publicly.
      - "127.0.0.1:8090:8090"
    volumes:
      # A named volume starts out owned by the image's non-root user. A bind
      # mount instead must be owned by uid 65532, mode 0700.
      - jellymesh-data:/data
      # The generated root, which Jellyfin must also mount. It must be
      # writable by uid 65532 and readable by Jellyfin.
      - /srv/jellymesh-generated:/generated
    environment:
      # How peers reach this node: its public name, and the forwarded port if
      # it differs from 8443.
      JELLYMESH_PUBLIC_HOSTNAME: "cedar.example.org"
      JELLYMESH_NODE_NAME: "Cedar"
      # The co-located Jellyfin, read as a dedicated user that is NOT an
      # administrator and can see only the libraries this node may publish.
      # With Jellyfin on the host network, reach it through the host gateway.
      JELLYMESH_JELLYFIN_URL: "http://host.docker.internal:8096"
      JELLYMESH_JELLYFIN_USER: "jellymesh"
      JELLYMESH_JELLYFIN_PASSWORD: "${JELLYMESH_JELLYFIN_PASSWORD:?set it in .env}"
      # Library IDs that must never be published, whatever the user can see.
      JELLYMESH_PROTECTED_LIBRARIES: ""
      # The relay Jellyfin plays remote items through (assumption A-10).
      # JELLYMESH_RELAY_URL is what Jellyfin connects to and what every .strm
      # names. The relay serves only the allowed client addresses: with
      # Jellyfin on the host network, its requests arrive from the Docker
      # bridge gateway.
      JELLYMESH_GENERATED_ROOT: "/generated"
      JELLYMESH_RELAY_LISTEN_ADDR: "0.0.0.0:8090"
      JELLYMESH_RELAY_URL: "http://127.0.0.1:8090"
      JELLYMESH_RELAY_ALLOWED_CLIENTS: "127.0.0.1,172.17.0.1"
      # Where Jellyfin sees the generated root, if it mounts it elsewhere.
      JELLYMESH_JELLYFIN_GENERATED_ROOT: "/srv/jellymesh-generated"
      # The most any one peer may pull from this node, in megabits per second.
      JELLYMESH_UPLOAD_CEILING_MBPS: "20"
      # Direct paths: the UDP socket (or "off"), the STUN servers that tell
      # the node its outside address, and any further addresses to offer,
      # such as this host's LAN address for members on the same network.
      JELLYMESH_DIRECT_LISTEN_ADDR: "0.0.0.0:41641"
      # JELLYMESH_STUN_SERVERS: "stun.l.google.com:19302,stun.cloudflare.com:3478"
      # JELLYMESH_DIRECT_CANDIDATES: "192.168.1.20:41641"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  jellymesh-data:
